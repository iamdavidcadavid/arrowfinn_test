# One command:  docker compose up --build
#   frontend  http://localhost:3000
#   backend   http://localhost:4000
# Tests:      docker compose --profile test run --rm backend-test

x-db: &db
  POSTGRES_DB: snapshot
  POSTGRES_USER: snapshot_owner
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owner-dev-password}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app-dev-password}

services:
  db:
    image: postgres:16-alpine
    environment: *db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapshot_owner -d snapshot"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Not published to the host: only the backend talks to Postgres.

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # This stack is a local dev environment. The image itself defaults to
      # NODE_ENV=production, in which the /dev/fills simulator cannot be enabled.
      NODE_ENV: development
      ENABLE_DEV_ENDPOINTS: "true"
      PORT: 4000
      # Runtime role: subject to Row-Level Security.
      DATABASE_URL: postgresql://snapshot_app:${APP_DB_PASSWORD:-app-dev-password}@db:5432/snapshot
      # Owner role: used only by the entrypoint for migrate + seed, then unset.
      MIGRATE_DATABASE_URL: postgresql://snapshot_owner:${POSTGRES_PASSWORD:-owner-dev-password}@db:5432/snapshot
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0123456789}
      ALLOWED_ORIGINS: http://localhost:3000
      SNAPSHOT_NOW: "2026-08-25T14:30:00Z"
      DATASET_DIR: /dataset
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}
    volumes:
      - ./dataset:/dataset:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Full test suite, including the Postgres RLS tests, against the seeded db.
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: build
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgresql://snapshot_app:${APP_DB_PASSWORD:-app-dev-password}@db:5432/snapshot
    command: ["npx", "jest", "--runInBand"]

volumes:
  pgdata:
